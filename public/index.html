<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voidless Engine Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h1>🥷 VOIDLESS ENGINE 🩸</h1>
        <p>Auto Relogin & Multi-Session Dashboard</p>
      </div>

      <!-- Tab Buttons -->
      <div class="tab-buttons">
        <button id="tabCredBtn" class="tab-btn active" onclick="switchTab('cred')">Gmail / Password</button>
        <button id="tabAppstateBtn" class="tab-btn" onclick="switchTab('appstate')">Appstate JSON</button>
      </div>

      <!-- FORM 1: EMAIL & PASSWORD LOGIN -->
      <form id="credLoginForm" class="login-form">
        <div class="input-group">
          <label for="fbEmail">FB Email / Gmail / Phone</label>
          <input type="text" id="fbEmail" placeholder="example@gmail.com" required />
        </div>

        <div class="input-group">
          <label for="fbPassword">FB Password</label>
          <input type="password" id="fbPassword" placeholder="••••••••" required />
        </div>

        <div class="input-row">
          <div class="input-group">
            <label for="credPrefix">Bot Prefix</label>
            <input type="text" id="credPrefix" value="/" placeholder="/" />
          </div>
          <div class="input-group">
            <label for="credAdmin">Admin UID</label>
            <input type="text" id="credAdmin" placeholder="1000XXXXXXXXX" />
          </div>
        </div>

        <button type="submit" id="credSubmitBtn" class="btn-submit">LOG IN WITH CREDENTIALS</button>
      </form>

      <!-- FORM 2: APPSTATE LOGIN -->
      <form id="appstateLoginForm" class="login-form hidden">
        <div class="input-group">
          <label for="appstateData">Appstate JSON Data</label>
          <textarea id="appstateData" rows="6" placeholder='[{"key": "c_user", "value": "..."}, ...]' required></textarea>
        </div>

        <div class="input-row">
          <div class="input-group">
            <label for="appPrefix">Bot Prefix</label>
            <input type="text" id="appPrefix" value="/" placeholder="/" />
          </div>
          <div class="input-group">
            <label for="appAdmin">Admin UID</label>
            <input type="text" id="appAdmin" placeholder="1000XXXXXXXXX" />
          </div>
        </div>

        <button type="submit" id="appSubmitBtn" class="btn-submit">LOG IN WITH APPSTATE</button>
      </form>

      <div id="statusMessage" class="status-msg hidden"></div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      const credForm = document.getElementById('credLoginForm');
      const appForm = document.getElementById('appstateLoginForm');
      const credBtn = document.getElementById('tabCredBtn');
      const appBtn = document.getElementById('tabAppstateBtn');

      if (tab === 'cred') {
        credForm.classList.remove('hidden');
        appForm.classList.add('hidden');
        credBtn.classList.add('active');
        appBtn.classList.remove('active');
      } else {
        credForm.classList.add('hidden');
        appForm.classList.remove('hidden');
        credBtn.classList.remove('active');
        appBtn.classList.add('active');
      }
    }

    function showStatus(text, isError = false) {
      const msgBox = document.getElementById('statusMessage');
      msgBox.innerText = text;
      msgBox.className = `status-msg ${isError ? 'error' : 'success'}`;
      msgBox.classList.remove('hidden');
    }

    // Handle Email + Password Submission
    document.getElementById('credLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('credSubmitBtn');
      btn.innerText = "Authenticating...";
      btn.disabled = true;

      const email = document.getElementById('fbEmail').value;
      const password = document.getElementById('fbPassword').value;
      const prefix = document.getElementById('credPrefix').value || '/';
      const admin = document.getElementById('credAdmin').value;

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, prefix, admin })
        });
        const result = await res.json();

        if (res.ok) {
          showStatus("✅ " + result.message);
        } else {
          showStatus("❌ " + (result.message || "Failed to login"), true);
        }
      } catch (err) {
        showStatus("❌ Network/Server Error: " + err.message, true);
      } finally {
        btn.innerText = "LOG IN WITH CREDENTIALS";
        btn.disabled = false;
      }
    });

    // Handle Appstate JSON Submission
    document.getElementById('appstateLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('appSubmitBtn');
      btn.innerText = "Authenticating...";
      btn.disabled = true;

      const rawAppstate = document.getElementById('appstateData').value;
      const prefix = document.getElementById('appPrefix').value || '/';
      const admin = document.getElementById('appAdmin').value;

      try {
        const state = JSON.parse(rawAppstate);
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state, prefix, admin })
        });
        const result = await res.json();

        if (res.ok) {
          showStatus("✅ " + result.message);
        } else {
          showStatus("❌ " + (result.message || "Failed to login"), true);
        }
      } catch (err) {
        showStatus("❌ Invalid Appstate JSON format or Server Error.", true);
      } finally {
        btn.innerText = "LOG IN WITH APPSTATE";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
