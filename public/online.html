<!DOCTYPE html>
<html lang="en">
   <head>
      <title>Active | VOIDLESS SIN</title>

      <!-- Bootstrap & FontAwesome -->
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
      
      <!-- Google Fonts (Fira Code for VOIDLESS SIN Theme) -->

      <!-- Custom CSS Link -->
      <link rel="stylesheet" href="styles.css">

      <!-- VOIDLESS SIN Component Styles -->
      <style>
         .user-card {
           display: flex;
           align-items: center;
           margin-bottom: 15px;
           border: 1px solid var(--void-border, rgba(255, 0, 85, 0.3));
           border-radius: 10px;
           padding: 12px;
           width: 100%;
           background: rgba(10, 10, 15, 0.85);
           backdrop-filter: blur(8px);
           box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
           overflow: hidden;
           animation: voidGlow 3s infinite alternate; 
           transition: all 0.3s ease;
         }

         .user-card:hover {
           border-color: var(--void-accent-magenta, #ff0055);
           box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
           transform: translateY(-2px);
         }

         @keyframes voidGlow {
           from {
             border-color: rgba(255, 0, 85, 0.2);
             box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
           }
           to {
             border-color: rgba(255, 0, 85, 0.7);
             box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
           }
         }

         .user-card img {
           width: 60px;
           height: 60px;
           object-fit: cover;
           border-radius: 8px;
           margin-right: 15px;
           border: 1px solid var(--void-border, rgba(255, 0, 85, 0.3));
         }

         .user-info {
           flex-grow: 1;
         }

         .user-info h4 {
           margin: 0 0 4px 0;
           font-size: 16px;
           font-weight: 700;
           color: #fff;
           text-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
           white-space: nowrap;
           overflow: hidden;
           text-overflow: ellipsis;
           text-align: start;
         }

         .user-info p {
           margin: 0;
           font-size: 12px;
           color: var(--void-text-muted, #8888a0);
           white-space: nowrap;
           overflow: hidden;
           text-overflow: ellipsis;
           text-align: start;
         }

         p.uptime-user {
           color: #00ff88;
           text-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
           font-weight: 500;
         }
      </style>
   </head>
   <body>

         </a>
         <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
           <span class="navbar-toggler-icon"></span>
         </button>
         <div class="collapse navbar-collapse justify-content-end" id="navbarNav" style="margin-right: 80px;">
            <ul class="navbar-nav">
               <li class="nav-item active">
                  <a class="nav-link" href="#">Active<span class="sr-only">(current)</span></a>
               </li>
               <li class="nav-item">
                  <a class="nav-link" href="/">Home</a>
               </li>
               <li class="nav-item dropdown">
                 <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"> Features </a>
                 <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                   <a class="dropdown-item" href="/step_by_step_guide">Step-by-Step Guide</a>
                   <div class="dropdown-divider"></div>
                   <a class="dropdown-item" href="https://zark-spam-share.onrender.com/">SpamShare-Tools</a>
                   <div class="dropdown-divider"></div>
                   <a class="dropdown-item" href="https://my-portfolio-f9lz.onrender.com/">Developer</a>
                 </div>
               </li>
               <li class="nav-item">
                 <a class="nav-link" href="tos-privacy-policy">Terms and Conditions</a>
               </li>
            </ul>
         </div>
      </nav>

      <div class="container">
         <div class="row">
            <h1 class="col text-center" style="font-size: 20px; padding: 10px;">Current Online:</h1>
         </div>
         <div class="row" id="user_online"></div>
      </div>

      <button id="scrollUpBtn"><i class="fa-solid fa-angles-up"></i></button>

      <script>
         async function listOfAi() {
             const userOnline = document.getElementById("user_online");
             try {
                 const response = await fetch("/info");
                 const data = await response.json();
                 userOnline.innerHTML = '';
                 data.forEach(user => {
                     const {
                         name,
                         thumbSrc,
                         profileUrl,
                         time,
                     } = user;
                     const userCard = document.createElement('div');
                     userCard.className = 'col-12 user-card mb-3';
                     
                     const image = document.createElement('img');
                     image.src = thumbSrc;
                     image.alt = 'User Thumbnail';
                     
                     const userInfo = document.createElement('div');
                     userInfo.className = 'user-info';
                     
                     const userName = document.createElement('h4');
                     userName.textContent = name;
                     
                     const profileLink = document.createElement('p');
                     profileLink.innerHTML = `${profileUrl}`;
                     
                     const uptimeUser = document.createElement('p');
                     uptimeUser.className = 'uptime-user';
                     uptimeUser.innerHTML = `Uptime: ${timeFormat(time)}`;
                     
                     userInfo.appendChild(userName);
                     userInfo.appendChild(profileLink);
                     userInfo.appendChild(uptimeUser);
                     userCard.appendChild(image);
                     userCard.appendChild(userInfo);
                     userOnline.appendChild(userCard);
    
                     setInterval(() => {
                         user.time++;
                         updateTimer(userCard, user.time);
                     }, 1000); 
                 });
             } catch (error) {
                 console.error(error);
                 userOnline.innerHTML = `<div class="alert alert-danger w-100" role="alert">An error occurred while fetching data.</div>`;
             }
         }
         
         function updateTimer(userCard, currentTime) {
             const uptimeUser = userCard.querySelector('.uptime-user');
             uptimeUser.textContent = `Uptime: ${timeFormat(currentTime)}`;
         }
         
        function timeFormat(currentTime) {
            const days = Math.floor(currentTime / (3600 * 24));
            const hours = Math.floor((currentTime % (3600 * 24)) / 3600);
            const minutes = Math.floor((currentTime % 3600) / 60);
            const seconds = currentTime % 60;

            let timeParts = [];
            if (days > 0) timeParts.push(`${days} day${days > 1 ? 's' : ''}`);
            if (hours > 0) timeParts.push(`${hours} hour${hours > 1 ? 's' : ''}`);
            if (minutes > 0) timeParts.push(`${minutes} minute${minutes > 1 ? 's' : ''}`);
            timeParts.push(`${seconds} second${seconds > 1 ? 's' : ''}`);

            return timeParts.join(' ');
        }

         listOfAi();
      </script>

      <!-- Dependencies Scripts -->
      <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
      <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
      
      <script>
         let tracks = [
            "https://raw.githubusercontent.com/Kaizenji/Kaizenji/main/aura.mp3",
            "https://raw.githubusercontent.com/Kaizenji/Kaizenji/main/next.mp3",
            "https://raw.githubusercontent.com/Kaizenji/Kaizenji/main/avangard.mp3",
            "https://raw.githubusercontent.com/Kaizenji/Kaizenji/main/life-force.mp3",
            "https://raw.githubusercontent.com/Kaizenji/Kaizenji/main/cute-depressed.mp3"
         ];
         
         let randomTrack = tracks[Math.floor(Math.random() * tracks.length)];
         
         let sound = new Howl({
           src: [randomTrack],
           autoplay: true,
           loop: false,
           format: ["mp3"],
           volume: 2.0
         });
         
         sound.play();
      </script>
      <script src="script.js"></script>
   </body>
</html>
